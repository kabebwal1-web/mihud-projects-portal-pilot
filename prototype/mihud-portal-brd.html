<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MIHUD Projects Portal — BRD Workflow Prototype</title>
<style>
:root{--ink:#1b2a3a;--muted:#667180;--paper:#f6f2ea;--surface:#fff;--line:#e4dccc;--accent:#c1571e;--ok:#2f7a4f;--warn:#b8841a;--danger:#b23a2e;--neutral:#8a8478;--blue:#28658f}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{min-height:100vh;display:flex}.side{width:245px;background:var(--surface);border-right:1px solid var(--line);padding:22px 14px;flex:none}.brand{display:flex;gap:10px;align-items:center;padding:0 10px 25px;font-size:18px;font-weight:700}.brandmark{background:var(--ink);color:white;padding:10px;border-radius:8px}.nav button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:11px 13px;border-radius:7px;color:var(--muted);margin:3px 0}.nav button.active,.nav button:hover{background:var(--ink);color:#fff}.content{min-width:0;flex:1}.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px}.user{display:flex;gap:9px;align-items:center}.avatar{background:#f7e4d6;color:#7a3212;width:35px;height:35px;border-radius:50%;display:grid;place-items:center;font-weight:bold}.main{max-width:1450px;margin:auto;padding:28px}.head{display:flex;justify-content:space-between;gap:18px;align-items:end;flex-wrap:wrap;margin-bottom:22px}.h1{font:600 30px Georgia;margin:0}.muted{color:var(--muted)}.btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:9px 14px;font-weight:bold}.primary{background:var(--accent);border-color:var(--accent);color:white}.danger{background:var(--danger);border-color:var(--danger);color:#fff}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:18px}.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:18px}.kpi b{display:block;font:600 24px Georgia;margin-top:8px}.kpi span{color:var(--muted)}.layout{display:grid;grid-template-columns:350px 1fr;gap:18px}.list{display:flex;flex-direction:column;gap:9px;max-height:650px;overflow:auto}.item{border:1px solid var(--line);border-left:4px solid var(--neutral);background:#fff;border-radius:7px;padding:13px;text-align:left}.item.selected{background:#f7e4d6;border-color:var(--accent)}.item strong{display:block;margin-bottom:5px}.badge{display:inline-block;padding:4px 9px;border-radius:99px;font-size:11px;font-weight:bold}.ok{background:#eaf3ed;color:var(--ok)}.warn{background:#fbf1df;color:var(--warn)}.bad{background:#fbeae7;color:var(--danger)}.grey{background:#efede8;color:var(--neutral)}.orange{background:#f7e4d6;color:#7a3212}.bar{height:9px;background:#eee8da;border-radius:5px;overflow:hidden}.fill{height:100%;background:var(--accent)}.tabs{display:flex;gap:16px;border-bottom:1px solid var(--line);margin:20px 0;overflow:auto}.tabs button{border:0;background:none;padding:10px 3px;color:var(--muted);font-weight:bold;white-space:nowrap;border-bottom:2px solid transparent}.tabs button.active{color:var(--ink);border-color:var(--accent)}.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;background:var(--paper);padding:15px;border-radius:7px}.meta small{display:block;color:var(--muted);margin-bottom:4px}.meta strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stepper{display:flex;align-items:center;overflow:auto;padding:8px 0 20px}.step{width:35px;height:35px;border:2px solid var(--line);border-radius:50%;display:grid;place-items:center;flex:none;background:#fff}.step.done{background:var(--ok);color:#fff;border-color:var(--ok)}.step.current{border-color:var(--accent);background:#f7e4d6}.line{height:2px;width:40px;background:var(--line);flex:none}.line.done{background:var(--ok)}.task{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--paper);padding:12px;border-radius:7px;margin:8px 0}.workflow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.flow{border:1px solid var(--line);border-top:4px solid var(--accent);padding:14px;border-radius:7px;background:#fff}.flow h3{margin:0 0 10px;font-family:Georgia}.flow .arrow{text-align:center;color:var(--accent);font-size:20px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid var(--line)}.table th{color:var(--muted);font-size:12px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px;font-weight:bold;color:var(--muted)}.field.full{grid-column:1/-1}input,select,textarea{border:1px solid var(--line);border-radius:6px;padding:9px;background:#fff;color:var(--ink)}textarea{min-height:80px}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:15px}.notice{padding:12px;border-radius:7px;background:#fff9ed;border:1px solid #f0d494;margin:12px 0}.hidden{display:none!important}.evidence{border:1px dashed var(--line);padding:14px;border-radius:7px;margin-top:12px}.footer{text-align:center;color:var(--muted);font-size:12px;padding:22px}.mobile-menu{display:none}@media(max-width:1000px){.side{width:205px}.cards{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.workflow{grid-template-columns:1fr 1fr}}@media(max-width:650px){.side{display:none}.mobile-menu{display:block;border:0;background:none}.main{padding:18px}.cards,.workflow,.form{grid-template-columns:1fr}.meta{grid-template-columns:1fr 1fr}.top{padding:0 16px}}
</style></head>
<body><div class="shell"><aside class="side"><div class="brand"><span class="brandmark">▦</span><span>Projects Portal<br><small class="muted">MIHUD Pilot</small></span></div><nav class="nav" id="nav"><button data-page="dashboard" class="active">▦ Dashboard</button><button data-page="execution">▶ Execution</button><button data-page="inspections">✓ Inspections</button><button data-page="payments">$ Payments</button><button data-page="variations">↻ Contract variations</button><button data-page="termination">⊗ Termination</button><button data-page="issues">⚠ Issues & evidence</button><button data-page="documents">▤ Documents</button><button data-page="certificates">▧ Certificates</button><button data-page="settings">⚙ Settings</button></nav></aside><section class="content"><header class="top"><button class="mobile-menu" onclick="document.querySelector('.side').style.display='block'">☰</button><span class="muted">Real-time project and contract management</span><div class="user"><span>🔔</span><span class="avatar">BK</span><span><b>Bwalya Kafumukachi</b><br><small class="muted">System Administrator</small></span></div></header><main class="main" id="app"></main><div class="footer">Projects Portal Pilot · Ministry of Infrastructure, Housing and Urban Development · Standalone BRD prototype</div></section></div>
<script>
const projects=[{id:'PRJ-1001',name:'Construction of Smart Zambia Office',type:'Turnkey',client:'Smart Zambia Institute',contractor:'Department of Public Infrastructure',budget:6000000,spent:1976100,status:'On Track',end:'24 Jun 2024',milestones:[['Project Initiation','Complete'],['Design and Permitting','Complete'],['Mobilisation','Complete'],['Foundation Works','Complete'],['Structural Works','Complete'],['Interior Construction','In Progress'],['Finishes and Fittings','Not Started'],['Commissioning and Handover','Not Started']],tasks:['Build interior walls','Install plumbing, electrical and HVAC systems','Finish interior spaces'],docs:['Bill of Quantities.pdf','Architectural Drawings.pdf','Signed Contract.pdf']},{id:'PRJ-1002',name:'Lusaka–Ndola Dual Carriageway (Phase 2)',type:'Central Government Funded',client:'MIHUD',contractor:'RDA Construction Consortium',budget:480000000,spent:210500000,status:'Requiring Action',end:'31 Dec 2025',milestones:[['Mobilisation','Complete'],['Design Review','Complete'],['Land & Utility Clearance','Complete'],['Earthworks and Drainage','In Progress'],['Pavement Works','Not Started'],['Handover','Not Started']],tasks:['Bulk earthworks — Ch. 0-15km','Culvert installation','Drainage lining'],docs:['Environmental Impact Assessment.pdf']},{id:'PRJ-1003',name:'Kasama District Housing Units (120 Units)',type:'PPP',client:'National Housing Authority',contractor:'Copperbelt Builders Ltd',budget:54000000,spent:31200000,status:'Suspended',end:'31 Mar 2024',milestones:[['Site Development','Complete'],['Foundations (Blocks A–D)','Complete'],['Superstructure (Blocks A–D)','In Progress'],['Roofing and Finishes','Not Started']],tasks:['Block A superstructure','Block B superstructure','Block C superstructure'],docs:[]}];
let selected=projects[0], activePage='dashboard', activeTab='overview', tasks={}; let issues=[{id:'CMP-1001',title:'Equipment left lying around',project:projects[1].name,status:'In Progress',risk:'Medium',channel:'Projects Portal',evidence:[]}];
const money=n=>'ZMW '+n.toLocaleString('en-US',{minimumFractionDigits:2});const tone=s=>['On Track','Complete','Paid','Approved','Resolved'].includes(s)?'ok':['Requiring Action','Outstanding','Unresolved','Rejected'].includes(s)?'bad':['Suspended','Closed','Not Started'].includes(s)?'grey':s==='In Progress'?'orange':'warn';const badge=s=>`<span class="badge ${tone(s)}">${s}</span>`;const pct=p=>Math.round(p.milestones.filter(x=>x[1]==='Complete').length/p.milestones.length*100);
function render(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===activePage));let out='';if(activePage==='dashboard')out=dashboard();else if(activePage==='execution')out=execution();else if(activePage==='issues')out=issuesPage();else if(activePage==='inspections')out=generic('Inspections','Inspection requests, offline forms, geotagged site evidence and NCC synchronisation','✓');else if(activePage==='payments')out=payments();else if(activePage==='variations')out=variation();else if(activePage==='termination')out=termination();else if(activePage==='documents')out=generic('Documents','Controlled project documents, metadata, permissions, folioing and retrieval','▤');else if(activePage==='certificates')out=generic('Certificates','Interim, completion and digitally signed certificates','▧');else out=generic('Settings','Complaint categories, SLA rules, integrations and access control','⚙');document.getElementById('app').innerHTML=out;bind();}
function head(title,sub,button=''){return `<div class="head"><div><h1 class="h1">${title}</h1><p class="muted">${sub}</p></div>${button}</div>`}
function dashboard(){let spent=projects.reduce((a,p)=>a+p.spent,0);return head('Dashboard',"Real-time visibility across every project in the Ministry's portfolio.",'<button class="btn primary" onclick="newProject()">＋ New project</button>')+`<div class="cards"><div class="card kpi">Projects<b>${projects.length}</b></div><div class="card kpi">Expenditure<b>${money(spent)}</b></div><div class="card kpi">Open complaints<b style="color:var(--danger)">${issues.filter(x=>x.status!=='Resolved').length}</b></div><div class="card kpi">Pending actions<b style="color:var(--warn)">4</b></div></div><div class="card" style="margin-bottom:18px"><b>Projects by status</b><div style="display:flex;height:27px;gap:2px;margin-top:12px">${['On Track','Closely Monitored','Requiring Action','Suspended'].map(s=>`<button style="flex:1;background:${s==='On Track'?'var(--ok)':s==='Requiring Action'?'var(--danger)':s==='Closely Monitored'?'var(--warn)':'var(--neutral)'};color:#fff;border:0">${projects.filter(p=>p.status===s).length||''}</button>`).join('')}</div></div><div class="layout"><div class="card"><b>All projects (${projects.length})</b><div class="list" style="margin-top:12px">${projects.map(p=>`<button class="item ${selected.id===p.id?'selected':''}" style="border-left-color:${p.status==='On Track'?'var(--ok)':p.status==='Requiring Action'?'var(--danger)':'var(--neutral)'}" onclick="selectProject('${p.id}')"><strong>${p.name}</strong>${badge(p.status)}<small class="muted">${p.contractor}</small><div class="bar" style="margin-top:10px"><div class="fill" style="width:${pct(p)}%"></div></div></button>`).join('')}</div></div>${projectDetail()}</div>`}
function projectDetail(){let p=selected;return `<div class="card"><div class="head"><div><h2 style="font:600 23px Georgia;margin:0">${p.name} ${badge(p.status)}</h2><p class="muted">${p.client} · ${p.contractor}</p></div><strong style="font-size:20px">${pct(p)}%</strong></div><div class="meta"><div><small>Type</small><strong>${p.type}</strong></div><div><small>Budget</small><strong>${money(p.budget)}</strong></div><div><small>Expenditure</small><strong>${money(p.spent)}</strong></div><div><small>End date</small><strong>${p.end}</strong></div></div><div class="tabs">${['overview','milestones','payments','documents','certificates','issues'].map(t=>`<button class="${activeTab===t?'active':''}" onclick="tab('${t}')">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div>${activeTab==='overview'?`<div class="workflow"><div class="flow"><h3>Execution</h3><p>Contractor updates tasks and submits milestone completion requests.</p><div class="arrow">↓</div><b>${p.milestones.find(x=>x[1]!=='Complete')?.[0]||'Complete'}</b></div><div class="flow"><h3>Inspection</h3><p>Inspection is triggered for submitted milestone completion requests.</p><div class="arrow">↓</div>${badge('Awaiting Inspection')}</div><div class="flow"><h3>Payment</h3><p>Approved payable milestones create IPC and payment actions.</p><div class="arrow">↓</div>${badge('Pending Approval')}</div></div>`:activeTab==='milestones'?milestonePanel():activeTab==='documents'?`<h3>Project documents</h3>${p.docs.map(d=>`<div class="task">▤ ${d}<span class="muted">View · Download</span></div>`).join('')||'<p class="muted">No documents uploaded.</p>'}<button class="btn primary" onclick="uploadEvidence()">＋ Upload document</button>`:activeTab==='issues'?`<p>Linked issues</p>${issues.filter(i=>i.project===p.name).map(i=>`<div class="task"><b>${i.id} · ${i.title}</b>${badge(i.status)}</div>`).join('')||'<p class="muted">No linked issues.</p>'}`:`<div class="notice">${activeTab} workflow is available in the portal navigation and follows the BRD approval process.</div>`}</div>`}
function milestonePanel(){let p=selected;return `<div class="stepper">${p.milestones.map((m,i)=>`<span class="step ${m[1]==='Complete'?'done':'current'}">${m[1]==='Complete'?'✓':i+1}</span>${i<p.milestones.length-1?'<span class="line"></span>':''}`).join('')}</div><h3>${p.milestones.find(x=>x[1]!=='Complete')?.[0]||'All milestones complete'}</h3>${p.tasks.map((t,i)=>`<div class="task"><span>${t} ${badge(tasks[t]||'Not Started')}</span><button class="btn" onclick="advanceTask('${t}')">${tasks[t]==='In Progress'?'Submit for inspection':'Update task'}</button></div>`).join('')}`}
function execution(){return head('Execution','Exact BRD execution workflow: task selection → deliverable → inspection → certificate → payable milestone.')+`<div class="workflow"><div class="flow"><h3>Supplier / Contractor</h3><b>1. Select next task</b><p>Perform task and update status.</p><button class="btn primary" onclick="advanceTask('${selected.tasks[0]}')">Update task</button></div><div class="flow"><h3>Procuring Entity / Inspector</h3><b>2. Review and inspect</b><p>Receive request, conduct inspection and produce inspection report.</p><button class="btn" onclick="alert('Inspection request created')">Receive inspection request</button></div><div class="flow"><h3>Contract Management Team</h3><b>3. Approve completion</b><p>Approve completion request and issue digitally signed certificate.</p><button class="btn" onclick="alert('Certificate workflow started')">Approve completion</button></div></div><div class="card" style="margin-top:18px"><h3>Workflow state</h3>${milestonePanel()}</div>`}
function payments(){return head('Payments','Payment workflow: payment document → security check → approval → disbursement → receipt.')+`<div class="workflow"><div class="flow"><h3>Supplier</h3><p>Issue payment document against approved milestone and submit security where required.</p>${badge('Submitted')}</div><div class="flow"><h3>Contract Management Team</h3><p>Validate payment, calculate interest for late payment and request approval.</p>${badge('Under Review')}</div><div class="flow"><h3>Controlling Officer / Finance</h3><p>Approve and issue payment. The system marks the document paid and generates receipt.</p><button class="btn primary" onclick="alert('Payment issued; receipt generated')">Issue payment</button></div></div>`}
function variation(){return head('Contract Variation','Exact BRD variation workflow: request → review → proposal → funds check → approval → addendum.')+`<div class="workflow"><div class="flow"><h3>Contractor / Project Team</h3><p>Request variation or price adjustment and upload evidence.</p><button class="btn primary" onclick="openModal('variation')">Request variation</button></div><div class="flow"><h3>Procurement Unit</h3><p>Review request, request proposal, evaluate recommendation and forward for approval.</p>${badge('Under Review')}</div><div class="flow"><h3>Approval Authority</h3><p>Approve, send back with comments, or reject. Approved changes generate a contract addendum.</p><button class="btn" onclick="alert('Variation approved; addendum generated')">Approve variation</button></div></div>`}
function termination(){return head('Termination of Contract','Exact BRD termination swimlane: request → forward to authority → approve → terminated → termination report.')+`<div class="workflow"><div class="flow"><h3>Contract Management Team</h3><p>Document grounds, reasons, actions taken and costs. Submit request.</p><button class="btn primary" onclick="openModal('termination')">Request termination</button></div><div class="flow"><h3>Procurement Unit</h3><p>Review request and forward it to the relevant authority.</p>${badge('Forward for approval')}</div><div class="flow"><h3>Authority</h3><p>Approve or reject the request. Approved requests terminate the contract and generate the report.</p><button class="btn danger" onclick="alert('Contract terminated; report generated')">Approve termination</button></div></div>`}
function issuesPage(){return head('Issues & evidence','Omni-channel complaint handling with unique tickets, SLA tracking, assignments, investigation notes and evidence upload.','<button class="btn primary" onclick="openModal(\'issue\')">＋ Log issue</button>')+`<div class="card"><table class="table"><thead><tr><th>Ticket</th><th>Issue</th><th>Project</th><th>Channel</th><th>Status</th><th>Evidence</th></tr></thead><tbody>${issues.map(i=>`<tr><td>${i.id}</td><td><b>${i.title}</b><br><small class="muted">Risk: ${i.risk}</small></td><td>${i.project}</td><td>${i.channel}</td><td>${badge(i.status)}</td><td>${i.evidence.length} file(s) <button class="btn" onclick="addEvidence('${i.id}')">＋</button></td></tr>`).join('')}</tbody></table></div>`}
function generic(t,s,icon){return head(t,s)+`<div class="card" style="text-align:center;padding:60px"><div style="font-size:38px;color:var(--accent)">${icon}</div><h2>${t} workflow</h2><p class="muted">This module is scaffolded for the BRD workflow and is ready for integration.</p></div>`}
function openModal(type){let title=type==='issue'?'Log complaint / issue':type==='variation'?'Request contract variation':'Request termination';document.body.insertAdjacentHTML('beforeend',`<div id="modal" style="position:fixed;inset:0;background:#1b2a3a66;display:grid;place-items:center;padding:18px"><div class="card" style="width:650px;max-width:100%"><h2 style="font:600 22px Georgia;margin-top:0">${title}</h2><div class="form"><label class="field">Title<input id="m-title" placeholder="Short title"></label><label class="field">Project<select id="m-project">${projects.map(p=>`<option>${p.name}</option>`).join('')}</select></label><label class="field full">Details<textarea id="m-details" placeholder="Describe request, reasons, actions taken or findings"></textarea></label><label class="field full">Evidence<input id="m-file" type="file" multiple></label></div><div class="actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="submitModal('${type}')">Submit</button></div></div></div>`)}
function submitModal(type){if(type==='issue'){issues.unshift({id:'CMP-'+(1000+issues.length+1),title:document.getElementById('m-title').value||'New project issue',project:document.getElementById('m-project').value,status:'Unresolved',risk:'Medium',channel:'Web Portal',evidence:Array.from(document.getElementById('m-file').files).map(f=>f.name)});activePage='issues'}closeModal();render()}function closeModal(){document.getElementById('modal')?.remove()}function addEvidence(id){let i=issues.find(x=>x.id===id);let input=document.createElement('input');input.type='file';input.multiple=true;input.onchange=()=>{i.evidence.push(...Array.from(input.files).map(f=>f.name));render()};input.click()}function uploadEvidence(){alert('Document upload control opened in production version.')}function newProject(){alert('Project workspace creation form opened in production version.')}function selectProject(id){selected=projects.find(p=>p.id===id)||selected;activeTab='overview';render()}function tab(t){activeTab=t;render()}function advanceTask(t){tasks[t]=tasks[t]==='In Progress'?'Awaiting Inspection':'In Progress';render()}function bind(){document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{activePage=b.dataset.page;render()})}render();
</script></body></html>
